<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — GADELO Coffee Roasters</title>
<!-- Internal tool, not a page for shoppers — keep it out of search results. -->
<meta name="robots" content="noindex, nofollow">
<!-- Favicon (2026-09-22) — see index.html head comment for source/crop notes. -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="images/favicon/favicon-16x16.png" sizes="16x16" type="image/png">
<link rel="icon" href="images/favicon/favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="icon" href="images/favicon/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="images/favicon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Black+Han+Sans&family=Noto+Serif+KR:wght@400;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20260922">
</head>
<body>

<!-- Same minimal header pattern as checkout.html — an admin tool isn't the
     place for the full site nav either. -->
<header class="checkout-header">
  <div class="wrap checkout-header-row">
    <a class="brand" href="index.html#top">
      <img src="images/logo-white.png" alt="GADELO Coffee Roasters">
    </a>
    <span class="admin-badge">Admin</span>
  </div>
</header>

<main class="wrap admin-page">

  <!-- Login view — single shared admin password (ADMIN_PASSWORD secret on
       the Worker). See js/admin.js + paypal-worker/worker.js "ADMIN AUTH"
       section. -->
  <section class="admin-login" id="adminLogin">
    <h1 class="checkout-title">Admin Login</h1>
    <div class="addr-row">
      <input type="password" id="adminPassword" placeholder="Admin password" autocomplete="current-password">
    </div>
    <button type="button" class="btn btn-brass btn-block" id="adminLoginBtn">Log In</button>
    <p class="cart-hint admin-login-error" id="adminLoginError" hidden></p>
  </section>

  <!-- Orders view — shown once logged in -->
  <section class="admin-orders" id="adminOrders" hidden>
    <div class="admin-orders-head">
      <h1 class="checkout-title">Orders</h1>
      <div class="admin-orders-actions">
        <select id="adminStatusFilter">
          <option value="paid">Paid</option>
          <option value="">All (incl. pending/abandoned)</option>
          <option value="pending">Pending only</option>
        </select>
        <button type="button" class="btn btn-brass btn-sm" id="adminRefreshBtn">Refresh</button>
        <button type="button" class="btn btn-outline btn-sm" id="adminLogoutBtn">Log Out</button>
      </div>
    </div>
    <p class="cart-hint" id="adminOrdersStatus"></p>
    <div class="admin-table-wrap">
      <table class="admin-table" id="adminTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Name</th>
            <th>Contact</th>
            <th>Destination</th>
            <th>Delivery</th>
            <th>Items</th>
            <th>Total</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="adminTableBody"></tbody>
      </table>
    </div>
  </section>

</main>

<footer id="contact">
  <div class="wrap footer-bottom" style="border-top:1px solid rgba(239,234,214,.1);">
    <span>© 2026 GADELO Coffee Roasters (가델로 커피 로스터스). All rights reserved.</span>
  </div>
</footer>

<script src="js/admin.js"></script>
</body>
</html>
