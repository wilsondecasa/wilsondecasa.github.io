<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In / Sign Up — GADELO Coffee Roasters</title>
<meta name="description" content="Log in or create a GADELO Coffee Roasters account to save your delivery address and auto-fill it at checkout next time.">
<meta name="robots" content="noindex, nofollow">
<!-- Favicon (2026-09-22) — see index.html head comment for source/crop notes. -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="images/favicon/favicon-16x16.png" sizes="16x16" type="image/png">
<link rel="icon" href="images/favicon/favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="icon" href="images/favicon/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="images/favicon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Black+Han+Sans&family=Noto+Serif+KR:wght@400;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20260922">
</head>
<body>

<!-- Same minimal header pattern as checkout.html/admin.html — an account
     screen isn't the place for the full site nav either. -->
<header class="checkout-header">
  <div class="wrap checkout-header-row">
    <a class="brand" href="index.html#top">
      <img src="images/logo-white.png" alt="GADELO Coffee Roasters">
    </a>
    <span class="admin-badge">Account</span>
  </div>
</header>

<main class="wrap admin-page">
  <section class="admin-login" id="acctCard">

    <!-- Tabs — reuses the Post Box yes/no segmented-button pattern
         (.deliv-select/.deliv-opt from checkout.html) for visual
         consistency instead of inventing a new tab style. -->
    <div class="deliv-select" style="margin-bottom:24px;">
      <button type="button" class="deliv-opt active" id="tabLoginBtn">Log In</button>
      <button type="button" class="deliv-opt" id="tabSignupBtn">Sign Up</button>
    </div>

    <div id="loginForm">
      <h1 class="checkout-title" style="font-size:24px; margin-bottom:20px;">Log In</h1>
      <div class="addr-row">
        <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
      </div>
      <div class="addr-row">
        <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
      </div>
      <button type="button" class="btn btn-brass btn-block" id="loginSubmitBtn">Log In</button>
      <p class="admin-login-error" id="loginError" hidden></p>
    </div>

    <div id="signupForm" hidden>
      <h1 class="checkout-title" style="font-size:24px; margin-bottom:20px;">Create Account</h1>
      <div class="addr-row">
        <input type="email" id="signupEmail" placeholder="Email" autocomplete="email">
      </div>
      <div class="addr-row">
        <input type="password" id="signupPassword" placeholder="Password (min. 8 characters)" autocomplete="new-password">
      </div>
      <div class="addr-row">
        <input type="text" id="signupName" placeholder="Full name" autocomplete="name">
      </div>
      <div class="addr-row">
        <input type="tel" id="signupPhone" placeholder="Phone" autocomplete="tel">
      </div>
      <button type="button" class="btn btn-brass btn-block" id="signupSubmitBtn">Create Account</button>
      <p class="admin-login-error" id="signupError" hidden></p>
    </div>

    <div id="acctSuccess" hidden style="text-align:center; padding:12px 0;">
      <p style="font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:#8fcf7a; margin:0 0 10px;">✓ <span id="acctSuccessLabel">Logged in</span></p>
      <p class="cart-hint" id="acctSuccessName" style="margin-bottom:22px;"></p>
      <a href="index.html#blends" class="btn btn-outline" id="acctContinueBtn">Continue Shopping</a>
      <div style="margin-top:14px;">
        <button type="button" id="acctLogoutLink" style="background:none; border:none; cursor:pointer; font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.04em; color:#B7B191; text-decoration:underline;">Log out</button>
      </div>
    </div>

  </section>
</main>

<footer id="contact">
  <div class="wrap footer-bottom" style="border-top:1px solid rgba(239,234,214,.1);">
    <span>© 2026 GADELO Coffee Roasters (가델로 커피 로스터스). All rights reserved.</span>
  </div>
</footer>

<script src="js/customer.js"></script>
<script src="js/login.js"></script>
</body>
</html>
